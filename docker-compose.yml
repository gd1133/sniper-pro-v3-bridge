services:
  # 🤖 MOTOR DE TRADING (PYTHON)
  trading-bot:
    build: ./backend-core-Python
    restart: always
    env_file: .env
    depends_on:
      - api-bridge

  # 🌉 PONTE DE DADOS (NODE.JS)
  api-bridge:
    build: ./backend-api-Node.js
    ports:
      - "3000:3000"
    restart: always
    env_file: .env

  # 📊 DASHBOARD TERMINAL (REACT)
  dashboard:
    build: ./frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - api-bridge